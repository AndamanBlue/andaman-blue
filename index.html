<style>
body{margin:0;background:#F4F9F8}
a{color:#0B7A72}a:hover{color:#0B2A3C}
*{box-sizing:border-box}
.ab-btn{transition:transform .2s ease, box-shadow .2s ease}
.ab-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(11,42,60,.14)}
.ab-card{transition:transform .35s ease, box-shadow .35s ease}
.ab-card:hover{transform:translateY(-6px);box-shadow:0 24px 48px rgba(11,42,60,.12)}
.ab-track{display:flex;gap:56px;width:max-content;animation:ab-scroll 38s linear infinite}
@keyframes ab-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ab-float{animation:ab-bob 6s ease-in-out infinite}
@keyframes ab-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion: reduce){.ab-track,.ab-float{animation:none}}
input,select,textarea{font:inherit}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #0B7A72;outline-offset:2px}
</style>

<style>html{scroll-behavior:smooth}@media (max-width:700px){header{position:static !important}}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">


<div style="font-family: {{bodyFont}}; color: #0B2A3C; background: #F4F9F8; min-height: 100vh; overflow-x: hidden">

<!-- NAV -->
<header style="position: sticky; top: 0; z-index: 10; background: rgba(244,249,248,0.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(11,42,60,0.08)">
<div style="max-width: 1280px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="#top" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0B2A3C">
<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#0B2A3C"></circle><path d="M8 26 C12 22 16 22 20 26 C24 30 28 30 32 26" stroke="#5EE0D2" stroke-width="2.4" fill="none" stroke-linecap="round"></path><path d="M13 21 L17 10 L21 21 M19 21 L24 13 L28 21" stroke="#FF8A65" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"></path></svg>
<span style="display: flex; flex-direction: column; line-height: 1.1">
<span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: -0.02em">Andaman Blue</span>
<span style="font-size: 12px; color: #4A6270; letter-spacing: 0.2em">安达曼蓝 · アンダマンブルー</span>
</span>
</a>
<nav aria-label="Menu" style="display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 15px; font-weight: 500">
<a href="#destinations" style="color: #0B2A3C; text-decoration: none; padding: 10px 0">{{t.navDest}}</a>
<a href="#boats" style="color: #0B2A3C; text-decoration: none; padding: 10px 0">{{t.navExp}}</a>
<a href="#why" style="color: #0B2A3C; text-decoration: none; padding: 10px 0">{{t.navWhy}}</a>
<a href="#how" style="color: #0B2A3C; text-decoration: none; padding: 10px 0">{{t.navHow}}</a>
<a href="#contact" style="color: #0B2A3C; text-decoration: none; padding: 10px 0">{{t.navContact}}</a>
</nav>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<div role="group" aria-label="Language" style="display: flex; gap: 2px; padding: 4px; background: #FFFFFF; border: 1px solid rgba(11,42,60,0.1); border-radius: 999px">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="5">
<button type="button" onClick="{{l.pick}}" aria-pressed="{{l.pressed}}" style="border: 0; cursor: pointer; min-height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: {{l.bg}}; color: {{l.fg}}">{{l.label}}</button>
</sc-for>
</div>
<a class="ab-btn" href="#contact" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; background: #0B2A3C; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">{{t.navCta}}</a>
</div>
</div>
</header>

<!-- HERO -->
<section id="top" style="max-width: 1280px; margin: 0 auto; padding: 72px 24px 56px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 56px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 28px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 999px; background: #DFF3EF; color: #0B5F58; font-size: 14px; font-weight: 600">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 16c2.5 2 5 2 7.5 0s5-2 7.5 0 3.5 1.5 5 0"></path><path d="M12 3v9M12 4l6 7h-6"></path></svg>
{{t.kicker}}
</span>
<h1 style="margin: 0; font-family: {{displayFont}}; font-weight: 900; font-size: clamp(46px, 6.4vw, 96px); line-height: 1.08; letter-spacing: -0.02em; white-space: pre-line">{{t.h1}}</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.7; color: #4A6270; max-width: 34em">{{t.sub}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<a class="ab-btn" href="#contact" style="display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 30px; border-radius: 999px; background: {{accent}}; color: #0B2A3C; text-decoration: none; font-weight: 700; font-size: 17px">{{t.cta1}}
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<a class="ab-btn" href="#destinations" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 28px; border-radius: 999px; border: 1.5px solid #0B2A3C; color: #0B2A3C; text-decoration: none; font-weight: 600; font-size: 17px">{{t.cta2}}</a>
</div>
<p style="margin: 0; font-size: 14px; color: #4A6270; letter-spacing: 0.04em">{{t.note}}</p>
</div>

<div style="position: relative">
<div style="border-radius: 44px; overflow: hidden; background: #CFEDEA; box-shadow: 0 40px 80px rgba(11,42,60,0.16)">
<img src="https://images.unsplash.com/photo-1534008897995-27a23e859048?auto=format&fit=crop&w=1400&q=75" alt="Maya Bay, Phi Phi" style="display: block; width: 100%; height: clamp(420px, 52vw, 680px); object-fit: cover">
</div>
<div aria-hidden="true" style="position: absolute; top: 36px; right: -8px; writing-mode: vertical-rl; font-family: 'Noto Serif SC', serif; font-weight: 900; font-size: 28px; letter-spacing: 0.4em; color: #0B2A3C; background: #FFFFFF; padding: 22px 12px; border-radius: 999px; box-shadow: 0 12px 30px rgba(11,42,60,0.12)">安達曼之藍</div>
<div style="position: absolute; left: 24px; bottom: 24px; display: flex; flex-wrap: wrap; gap: 8px">
<span style="padding: 10px 16px; border-radius: 999px; background: rgba(255,255,255,0.88); backdrop-filter: blur(8px); font-size: 14px; font-weight: 600">Longtail</span>
<span style="padding: 10px 16px; border-radius: 999px; background: rgba(255,255,255,0.88); backdrop-filter: blur(8px); font-size: 14px; font-weight: 600">Speedboat</span>
<span style="padding: 10px 16px; border-radius: 999px; background: rgba(255,255,255,0.88); backdrop-filter: blur(8px); font-size: 14px; font-weight: 600">Catamaran</span>
</div>
</div>
</section>

<!-- MARQUEE -->
<div aria-hidden="true" style="overflow: hidden; background: #0B2A3C; color: #F4F9F8; padding: 20px 0">
<div class="ab-track" style="font-family: 'Noto Serif SC', serif; font-size: 24px; font-weight: 600; white-space: nowrap">
<span>甲米 Krabi</span><span style="color: #FF8A65">✦</span><span>ピピ島 Phi Phi</span><span style="color: #FF8A65">✦</span><span>푸껫 Phuket</span><span style="color: #FF8A65">✦</span><span>Koh Samui 苏梅</span><span style="color: #FF8A65">✦</span><span>ランタ島 Koh Lanta</span><span style="color: #FF8A65">✦</span><span>파타야 Pattaya</span><span style="color: #FF8A65">✦</span>
<span>甲米 Krabi</span><span style="color: #FF8A65">✦</span><span>ピピ島 Phi Phi</span><span style="color: #FF8A65">✦</span><span>푸껫 Phuket</span><span style="color: #FF8A65">✦</span><span>Koh Samui 苏梅</span><span style="color: #FF8A65">✦</span><span>ランタ島 Koh Lanta</span><span style="color: #FF8A65">✦</span><span>파타야 Pattaya</span><span style="color: #FF8A65">✦</span>
</div>
</div>

<!-- DESTINATIONS -->
<section id="destinations" style="max-width: 1280px; margin: 0 auto; padding: 112px 24px 48px; display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 760px">
<span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.24em; color: #0B7A72">01 — DESTINATIONS</span>
<h2 style="margin: 0; font-family: {{displayFont}}; font-weight: 900; font-size: clamp(36px, 4.4vw, 64px); line-height: 1.12">{{t.destTitle}}</h2>
</div>
<p style="margin: 0; max-width: 420px; font-size: 17px; line-height: 1.7; color: #4A6270">{{t.destSub}}</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 24px">
<sc-for list="{{dests}}" as="it" hint-placeholder-count="6">
<article class="ab-card" style="background: #FFFFFF; border-radius: 32px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid rgba(11,42,60,0.06)">
<img src="{{it.photo}}" alt="{{it.latin}}" loading="lazy" style="display: block; width: 100%; height: 260px; object-fit: cover">
<div style="padding: 26px 28px 30px; display: flex; flex-direction: column; gap: 14px; flex-grow: 1">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
<h3 style="margin: 0; font-family: {{displayFont}}; font-weight: 900; font-size: 30px">{{it.name}}</h3>
<span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; color: #4A6270">{{it.latin}}</span>
</div>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A6270; flex-grow: 1">{{it.desc}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{it.tags}}" as="tg" hint-placeholder-count="3">
<span style="padding: 6px 14px; border-radius: 999px; background: #EEF6F5; color: #0B5F58; font-size: 13px; font-weight: 600">{{tg.label}}</span>
</sc-for>
</div>
</div>
</article>
</sc-for>
</div>
</section>

<!-- BOATS -->
<section id="boats" style="max-width: 1280px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; flex-direction: column; gap: 16px">
<span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.24em; color: #0B7A72">02 — BOATS</span>
<h2 style="margin: 0; font-family: {{displayFont}}; font-weight: 900; font-size: clamp(36px, 4.4vw, 64px); line-height: 1.12">{{t.expTitle}}</h2>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 20px">
<sc-for list="{{exps}}" as="it" hint-placeholder-count="4">
<div class="ab-card" style="background: {{it.bg}}; border-radius: 28px; padding: 12px 12px 28px; display: flex; flex-direction: column; gap: 18px; min-height: 280px">
<img src="{{it.photo}}" alt="{{it.title}}" loading="lazy" style="display: block; width: 100%; height: 200px; object-fit: cover; border-radius: 20px">
<div style="padding: 0 16px; display: flex; flex-direction: column; gap: 18px">
<span style="width: 60px; height: 60px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0B2A3C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg>
</span>
<h3 style="margin: 0; font-family: {{displayFont}}; font-weight: 900; font-size: 24px">{{it.title}}</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #33505E">{{it.desc}}</p>
</div>
</div>
</sc-for>
</div>
</section>

<!-- WHY -->
<section id="why" style="background: #0B2A3C; color: #F4F9F8; border-radius: 56px 56px 0 0">
<div style="max-width: 1280px; margin: 0 auto; padding: 112px 24px; display: flex; flex-direction: column; gap: 56px">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 820px">
<span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.24em; color: #5EE0D2">03 — WHY US</span>
<h2 style="margin: 0; font-family: {{displayFont}}; font-weight: 900; font-size: clamp(36px, 4.4vw, 64px); line-height: 1.12">{{t.whyTitle}}</h2>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 40px 32px">
<sc-for list="{{whys}}" as="it" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 14px; padding-top: 24px; border-top: 1px solid rgba(244,249,248,0.2)">
<span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 44px; color: #FF8A65">{{it.n}}</span>
<h3 style="margin: 0; font-family: {{displayFont}}; font-weight: 900; font-size: 24px">{{it.title}}</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.75; color: #B9CED6">{{it.desc}}</p>
</div>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<span style="padding: 12px 20px; border-radius: 999px; border: 1px solid rgba(244,249,248,0.3); font-family: 'Noto Sans SC', sans-serif; font-size: 17px">中文</span>
<span style="padding: 12px 20px; border-radius: 999px; border: 1px solid rgba(244,249,248,0.3); font-family: 'Noto Sans JP', sans-serif; font-size: 17px">日本語</span>
<span style="padding: 12px 20px; border-radius: 999px; border: 1px solid rgba(244,249,248,0.3); font-family: 'Noto Sans KR', sans-serif; font-size: 17px">한국어</span>
<span style="padding: 12px 20px; border-radius: 999px; border: 1px solid rgba(244,249,248,0.3); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 17px">Tiếng Việt</span>
</div>
</div>
</section>

<!-- HOW -->
<section id="how" style="background: #0B2A3C">
<div style="background: #F4F9F8; border-radius: 56px 56px 0 0">
<div style="max-width: 1280px; margin: 0 auto; padding: 112px 24px 96px; display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; flex-direction: column; gap: 16px">
<span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.24em; color: #0B7A72">04 — HOW IT WORKS</span>
<h2 style="margin: 0; font-family: {{displayFont}}; font-weight: 900; font-size: clamp(36px, 4.4vw, 64px); line-height: 1.12">{{t.howTitle}}</h2>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px">
<sc-for list="{{steps}}" as="it" hint-placeholder-count="3">
<li style="background: #FFFFFF; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 16px; border: 1px solid rgba(11,42,60,0.06)">
<span style="width: 52px; height: 52px; border-radius: 999px; background: #DFF3EF; color: #0B5F58; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 20px">{{it.n}}</span>
<h3 style="margin: 0; font-family: {{displayFont}}; font-weight: 900; font-size: 24px">{{it.title}}</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A6270">{{it.desc}}</p>
</li>
</sc-for>
</ol>
</div>
</div>
</section>

<!-- GALLERY -->
<section style="max-width: 1280px; margin: 0 auto; padding: 32px 24px 96px; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 16px">
<span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.24em; color: #0B7A72">05 — INSPIRATION</span>

</div>

</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 16px; align-items: end">

{{it.label}}</figcaption>
</figure>
</sc-for>
</div>
</section>

<!-- CONTACT -->

<div style="background: #DFF3EF; border-radius: 48px; padding: clamp(32px, 5vw, 72px); display: flex; flex-wrap: wrap; gap: 56px">

</div>
</div>

<div style="flex: 1 1 420px; background: #FFFFFF; border-radius: 32px; padding: 32px">
